<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="共有前のURLから、アクセス解析や広告の効果を調べる情報を整理する小さなツール。入力したURLはブラウザ内で処理し、送信・保存しません。">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-pMAY0blnyK0bSOzg1Woc7vGNxBeDRLtxAX+NuovRdUk=' 'sha256-hSzPtmDZ1XxbgpUqJQ65toicRzQN7F75pRLy2cr6dlE='; base-uri 'none'; form-action 'none'">
  <title>URLをすっきりさせる</title>
  <style>
    :root { color-scheme: light dark; font: 1rem/1.5 system-ui, sans-serif; }
    body { max-width: 52rem; margin: 0 auto; padding: 1.25rem; }
    h1 { line-height: 1.2; }
    form, .result { display: grid; gap: .8rem; }
    textarea { box-sizing: border-box; width: 100%; min-height: 7rem; padding: .7rem; font: inherit; overflow-wrap: anywhere; }
    button { width: fit-content; min-height: 2.75rem; padding: .45rem .9rem; font: inherit; cursor: pointer; }
    .hint { color: color-mix(in srgb, currentColor 72%, transparent); }
    .error { color: #b42318; }
    .success { color: #16803c; }
    #removed-list { overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
    @media (max-width: 34rem) { body { padding: .9rem; } button { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <h1>URLをすっきりさせる</h1>
    <p>記事や商品ページのURLを送る前に、アクセス解析や広告用の情報を取り除きます。入力したURLはこのブラウザで処理し、送信・保存しません。</p>
    <button id="try-sample" type="button">架空のURLで試す</button>

    <form id="clean-form">
      <label for="url-input">整理したいURL</label>
      <textarea id="url-input" name="url" autocomplete="url" spellcheck="false" required></textarea>
      <p class="hint">http:// または https:// から始まるURLを入れてください。削除対象に含まれない情報は残します。</p>
      <button type="submit">URLを整理する</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="result" class="result" aria-labelledby="result-heading" hidden>
      <h2 id="result-heading">整理後のURL</h2>
      <label for="cleaned-url">送る前に結果を確認してください</label>
      <textarea id="cleaned-url" readonly spellcheck="false"></textarea>
      <button id="copy-button" type="button">整理後のURLをコピー</button>
      <p id="removed-count"></p>
      <ul id="removed-list"></ul>
    </section>

    <p class="hint">すべての長いURLが短くなるわけではありません。ページの表示に必要な情報もあるため、整理後のURLを確認してから使ってください。</p>
    <p class="hint"><a href="https://github.com/supportapp3-lab/url-cleaner-local">ソースコードを見る</a> · <a href="https://qiita.com/supportapp3/items/e142176237093d17c5c5">説明を読む（Qiita）</a></p>
    <noscript>このツールを使うには、ブラウザのJavaScriptを有効にしてください。入力したURLを外部に送る機能はありません。</noscript>
  </main>
  <script>(function (root) {
  "use strict";

  const KNOWN_TRACKING_KEYS = new Set([
    "gclid", "dclid", "gbraid", "wbraid", "fbclid", "msclkid", "mc_cid", "mc_eid"
  ]);

  function isTrackingKey(key) {
    const normalized = key.toLowerCase();
    return (normalized.startsWith("utm_") && normalized.length > 4) || KNOWN_TRACKING_KEYS.has(normalized);
  }

  function decodedParameterName(segment) {
    const equalsAt = segment.indexOf("=");
    const rawName = equalsAt === -1 ? segment : segment.slice(0, equalsAt);
    try {
      return decodeURIComponent(rawName.replace(/\+/g, " "));
    } catch {
      return null;
    }
  }

  function cleanUrl(input) {
    if (typeof input !== "string" || input.trim() === "") {
      throw new TypeError("Enter an HTTP or HTTPS URL.");
    }

    const source = input.trim();
    if (/[\u0000-\u0020\u007f]/.test(source)) {
      throw new TypeError("The URL contains whitespace or control characters. Remove them or encode spaces first.");
    }

    let parsed;
    try {
      parsed = new URL(source);
    } catch {
      throw new TypeError("Enter a complete, valid HTTP or HTTPS URL.");
    }

    if (parsed.protocol !== "http:" && parsed.protocol !== "https:") {
      throw new TypeError("Only HTTP and HTTPS URLs are supported.");
    }

    // Use the URL parser's serialized components as the sole authority for URL
    // boundaries. Looking for '?' or '#' in the original input can disagree
    // with how a browser treats unusual authority, userinfo, and path syntax.
    const serialized = parsed.href;
    const fragmentAt = serialized.indexOf("#");
    const beforeFragment = fragmentAt === -1 ? serialized : serialized.slice(0, fragmentAt);
    const fragment = fragmentAt === -1 ? "" : serialized.slice(fragmentAt);
    const search = parsed.search;
    if (search === "") {
      return { cleanedUrl: source, removedParameters: [] };
    }

    if (!beforeFragment.endsWith(search)) {
      throw new TypeError("The URL query could not be safely identified.");
    }

    const prefix = beforeFragment.slice(0, beforeFragment.length - search.length);
    const segments = search.slice(1).split("&");
    const kept = [];
    const removedParameters = [];

    for (const segment of segments) {
      const name = decodedParameterName(segment);
      if (name !== null && isTrackingKey(name)) {
        removedParameters.push(name);
      } else {
        kept.push(segment);
      }
    }

    if (removedParameters.length === 0) {
      return { cleanedUrl: source, removedParameters };
    }

    const query = kept.length > 0 ? `?${kept.join("&")}` : "";
    return { cleanedUrl: `${prefix}${query}${fragment}`, removedParameters };
  }

  const api = Object.freeze({ cleanUrl });
  if (typeof module === "object" && module.exports) {
    module.exports = api;
  }
  root.UrlCleanerCore = api;
})(globalThis);
</script>
  <script>(function () {
  "use strict";

  const form = document.querySelector("#clean-form");
  const input = document.querySelector("#url-input");
  const result = document.querySelector("#result");
  const output = document.querySelector("#cleaned-url");
  const status = document.querySelector("#status");
  const count = document.querySelector("#removed-count");
  const list = document.querySelector("#removed-list");
  const copyButton = document.querySelector("#copy-button");
  const errorMessages = new Map([
    ["Enter an HTTP or HTTPS URL.", "http:// または https:// から始まるURLを入れてください。"],
    ["The URL contains whitespace or control characters. Remove them or encode spaces first.", "URLに空白や改行が含まれています。取り除いてから試してください。"],
    ["Enter a complete, valid HTTP or HTTPS URL.", "URLを読み取れませんでした。http:// または https:// から始まるURLを確認してください。"],
    ["Only HTTP and HTTPS URLs are supported.", "http:// または https:// から始まるURLに対応しています。"],
    ["The URL query could not be safely identified.", "URLの情報を区別できませんでした。元のURLを確認してください。"]
  ]);

  document.querySelector("#try-sample").addEventListener("click", () => {
    input.value = "https://example.com/articles/123?utm_source=mail&utm_campaign=autumn&ref=guide#heading";
    form.requestSubmit();
  });

  function clearResult() {
    result.hidden = true;
    output.value = "";
    count.textContent = "";
    list.replaceChildren();
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    clearResult();
    status.className = "";

    try {
      const cleaned = UrlCleanerCore.cleanUrl(input.value);
      output.value = cleaned.cleanedUrl;
      count.textContent = cleaned.removedParameters.length
        ? `削除した情報は${cleaned.removedParameters.length}件です。以下に名前を表示します。`
        : "削除対象の情報はありませんでした。入力したURLをそのまま表示しています。";
      for (const name of cleaned.removedParameters) {
        const item = document.createElement("li");
        item.textContent = name;
        list.append(item);
      }
      result.hidden = false;
      status.textContent = "URLを整理しました。結果を確認してからコピーしてください。";
      status.className = "success";
    } catch (error) {
      status.textContent = errorMessages.get(error.message) || "URLを整理できませんでした。入力内容を確認してください。";
      status.className = "error";
    }
  });

  copyButton.addEventListener("click", async () => {
    if (result.hidden || output.value === "") return;
    status.className = "";
    try {
      if (!navigator.clipboard || typeof navigator.clipboard.writeText !== "function") {
        throw new Error("Clipboard access is unavailable.");
      }
      await navigator.clipboard.writeText(output.value);
      status.textContent = "URLをコピーしました。";
      status.className = "success";
    } catch {
      output.focus();
      output.select();
      status.textContent = "URLを選択しました。コピー操作を行ってください（Windowsなら Ctrl+C、Macなら ⌘C）。";
      status.className = "";
    }
  });
})();
</script>
</body>
</html>
